vvvv<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manuscript Collation Tool</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f8f9fa; }
        h1 { text-align: center; }
        .container { display: flex; gap: 20px; }
        .panel { flex: 1; }
        textarea { width: 100%; height: 600px; font-family: monospace; font-size: 16px; padding: 10px; }
        button { padding: 12px 24px; font-size: 16px; margin: 10px 0; }
        .diff { background: #fff; border: 1px solid #ddd; padding: 15px; white-space: pre-wrap; }
        .added { background: #d4edda; color: #155724; }
        .removed { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <h1>Manuscript Collation Tool</h1>
    <p style="text-align:center;">Paste two TXT files (e.g. P75 vs Vaticanus) and click Compare</p>
    
    <div class="container">
        <div class="panel">
            <h3>Manuscript 1 (e.g. P75)</h3>
            <textarea id="text1" placeholder="Paste first transcription here..."></textarea>
        </div>
        <div class="panel">
            <h3>Manuscript 2 (e.g. Vaticanus)</h3>
            <textarea id="text2" placeholder="Paste second transcription here..."></textarea>
        </div>
    </div>
    
    <div style="text-align:center;">
        <button onclick="compareTexts()">Compare Texts</button>
    </div>
    
    <div id="result" class="diff"></div>

    <script>
        function compareTexts() {
            const t1 = document.getElementById('text1').value.trim().split('\n');
            const t2 = document.getElementById('text2').value.trim().split('\n');
            let html = '<h3>Comparison Result (side-by-side style)</h3><pre>';
            
            const maxLen = Math.max(t1.length, t2.length);
            for (let i = 0; i < maxLen; i++) {
                const line1 = t1[i] || '';
                const line2 = t2[i] || '';
                if (line1 === line2) {
                    html += `<span style="color:#666">${(i+1).toString().padStart(3)} | ${line1}</span>\n`;
                } else {
                    html += `<span class="removed">${(i+1).toString().padStart(3)} | ${line1}</span>\n`;
                    html += `<span class="added">${(i+1).toString().padStart(3)} | ${line2}</span>\n`;
                }
            }
            html += '</pre>';
            document.getElementById('result').innerHTML = html;
        }
    </script>
</body>
</html>
